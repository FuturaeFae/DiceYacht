name: Build Dice Yacht iPhone

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify project payload exists
        shell: bash
        run: |
          set -euo pipefail
          test -f DiceYacht_Project.zip || (echo "DiceYacht_Project.zip is missing from the repository root." && exit 1)
          unzip -t DiceYacht_Project.zip

      - name: Extract Dice Yacht project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf diceyacht-source
          mkdir diceyacht-source
          unzip -q DiceYacht_Project.zip -d diceyacht-source
          test -f diceyacht-source/ios/project.yml
          test -f diceyacht-source/ios/DiceYacht/GameViewController.swift
          test -f diceyacht-source/ios/DiceYacht/NearbyNetworking.swift
          test -f diceyacht-source/ios/DiceYacht/GameAssets/index.html

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: diceyacht-source/ios
        run: xcodegen generate

      - name: Compile iOS app without signing
        working-directory: diceyacht-source/ios
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/DerivedData
          xcodebuild \
            -project DiceYacht.xcodeproj \
            -scheme DiceYacht \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="build/DerivedData/Build/Products/Release-iphonesimulator/Dice Yacht.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/DiceYacht-iOS-Simulator.zip"

      - name: Check optional iPhone signing secrets
        id: signing
        shell: bash
        env:
          CERT_B64: ${{ secrets.DICEYACHT_IOS_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.DICEYACHT_IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.DICEYACHT_IOS_PROFILE_B64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.DICEYACHT_IOS_KEYCHAIN_PASSWORD }}
          EXPORT_METHOD: ${{ secrets.DICEYACHT_IOS_EXPORT_METHOD }}
        run: |
          set -euo pipefail
          present=0
          for v in "$CERT_B64" "$CERT_PASSWORD" "$PROFILE_B64" "$KEYCHAIN_PASSWORD" "$EXPORT_METHOD"; do
            if [ -n "$v" ]; then present=$((present+1)); fi
          done
          if [ "$present" -ne 0 ] && [ "$present" -ne 5 ]; then
            echo "Some iOS signing secrets are configured, but not all five are present."
            echo "Required: DICEYACHT_IOS_CERT_P12_B64, DICEYACHT_IOS_CERT_PASSWORD, DICEYACHT_IOS_PROFILE_B64, DICEYACHT_IOS_KEYCHAIN_PASSWORD, DICEYACHT_IOS_EXPORT_METHOD"
            exit 1
          fi
          if [ "$present" -eq 5 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install iPhone signing credentials
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          CERT_B64: ${{ secrets.DICEYACHT_IOS_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.DICEYACHT_IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.DICEYACHT_IOS_PROFILE_B64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.DICEYACHT_IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/diceyacht.p12"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/diceyacht.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/diceyacht.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/diceyacht.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/diceyacht.keychain-db"
          security import "$RUNNER_TEMP/diceyacht.p12" -k "$RUNNER_TEMP/diceyacht.keychain-db" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$RUNNER_TEMP/diceyacht.keychain-db" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/diceyacht.keychain-db"

          security cms -D -i "$RUNNER_TEMP/diceyacht.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/diceyacht.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Archive signed iPhone app
        if: steps.signing.outputs.signed == 'true'
        working-directory: diceyacht-source/ios
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/DiceYacht.xcarchive build/export
          xcodebuild archive \
            -project DiceYacht.xcodeproj \
            -scheme DiceYacht \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DiceYacht.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export signed IPA
        if: steps.signing.outputs.signed == 'true'
        working-directory: diceyacht-source/ios
        shell: bash
        env:
          EXPORT_METHOD: ${{ secrets.DICEYACHT_IOS_EXPORT_METHOD }}
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
          </dict>
          </plist>
          EOF
          mkdir -p build/export
          xcodebuild -exportArchive \
            -archivePath build/DiceYacht.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist
          IPA=$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          cp "$IPA" "$GITHUB_WORKSPACE/DiceYacht-iPhone.ipa"

      - name: Prepare iOS build information
        shell: bash
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            printf '%s\n' 'SIGNED iPHONE BUILD CREATED. Installation eligibility depends on the Apple provisioning/distribution method used.' > DiceYacht-iOS-BUILD_INFO.txt
          else
            printf '%s\n' 'iOS source compiled successfully, but no Apple signing secrets were configured. The simulator ZIP is not installable on a physical iPhone. Configure Apple signing/provisioning to produce DiceYacht-iPhone.ipa.' > DiceYacht-iOS-BUILD_INFO.txt
          fi

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: DiceYacht-iOS
          path: |
            DiceYacht-iOS-Simulator.zip
            DiceYacht-iPhone.ipa
            DiceYacht-iOS-BUILD_INFO.txt
          if-no-files-found: warn
          retention-days: 30
