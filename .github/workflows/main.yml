name: Build Dice Yacht APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the two-file repository
        uses: actions/checkout@v4

      - name: Verify project payload exists
        run: |
          test -f DiceYacht_Project.zip || (echo "DiceYacht_Project.zip is missing from the repository root." && exit 1)
          unzip -t DiceYacht_Project.zip

      - name: Extract Dice Yacht project
        run: |
          rm -rf android-source
          mkdir android-source
          unzip -q DiceYacht_Project.zip -d android-source
          test -f android-source/settings.gradle
          test -f android-source/app/build.gradle
          test -f android-source/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build official debug APK
        working-directory: android-source
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare easy-to-find APK
        run: |
          test -f android-source/app/build/outputs/apk/debug/app-debug.apk
          cp android-source/app/build/outputs/apk/debug/app-debug.apk DiceYacht-1.0.4.apk
          ls -lh DiceYacht-1.0.4.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DiceYacht-Android-1.0.4
          path: DiceYacht-1.0.4.apk
          if-no-files-found: error
          retention-days: 30
