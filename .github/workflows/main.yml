name: Build Dice Yacht APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify project payload exists
        shell: bash
        run: |
          set -euo pipefail
          test -f DiceYacht_Project_v1.0.6.zip || (echo "DiceYacht_Project_v1.0.6.zip is missing from the repository root." && exit 1)
          unzip -t DiceYacht_Project_v1.0.6.zip

      - name: Extract Dice Yacht project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-source
          mkdir android-source
          unzip -q DiceYacht_Project_v1.0.6.zip -d android-source
          test -f android-source/settings.gradle
          test -f android-source/build.gradle
          test -f android-source/app/build.gradle
          test -f android-source/app/src/main/AndroidManifest.xml
          test -f android-source/app/src/main/java/com/diceyacht/app/MainActivity.java
          test -f android-source/app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          command -v sdkmanager
          sdkmanager --version
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Gradle
        run: gradle --version

      - name: Build official debug APK
        working-directory: android-source
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare easy-to-find APK
        shell: bash
        run: |
          set -euo pipefail
          test -f android-source/app/build/outputs/apk/debug/app-debug.apk
          cp android-source/app/build/outputs/apk/debug/app-debug.apk DiceYacht-1.0.6.apk
          ls -lh DiceYacht-1.0.6.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DiceYacht-Android-1.0.6
          path: DiceYacht-1.0.6.apk
          if-no-files-found: error
          retention-days: 30
